name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run local-build

      - name: Fix node_modules/.bin symlinks for portable deployment
        run: |
          cd node_modules/.bin
          for f in *; do
            if [ -L "$f" ]; then
              target=$(readlink -f "$f")
              rel=$(python3 -c "import os.path; print(os.path.relpath('$target', '.'))")
              rm "$f"
              {
                echo '#!/bin/sh'
                echo 'basedir=$(dirname "$(echo "$0" | sed -e '\''s,\\,/,g'\'')")'
                echo 'case `uname` in'
                echo '    *CYGWIN*|*MINGW*|*MSYS*)'
                echo '        if command -v cygpath > /dev/null 2>&1; then'
                echo '            basedir=$(cygpath -w "$basedir")'
                echo '        fi'
                echo '    ;;'
                echo 'esac'
                echo "exec node \"\$basedir/$rel\" \"\$@\""
              } > "$f"
              chmod +x "$f"
              echo "Fixed: $f -> $rel"
            fi
          done

      - name: Create deployment zip
        run: |
          zip -r deploy.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.opencode/*' \
            -x '*.zip' \
            -x 'deploy.zip' \
            -x 'node_modules/.cache/*' \
            -x 'apps/web/.next/cache/*' \
            -x 'azure_logs/*' \
            -x 'webapp_logs/*'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables
        run: |
          az webapp config appsettings set \
            --name stock-platform-roy \
            --resource-group rg-yuzora_roy_ai \
            --settings \
              OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              LLM_PROVIDER=openai \
              LLM_BACKEND_URL=https://opencode.ai/zen/v1 \
              DEEP_THINK_MODEL=big-pickle \
              QUICK_THINK_MODEL=big-pickle \
              FALLBACK_LLM_PROVIDER=openai \
              FALLBACK_DEEP_THINK_MODEL=nemotron-3-ultra-free \
              FALLBACK_QUICK_THINK_MODEL=nemotron-3-ultra-free \
              LLM_TEMPERATURE=0.7 \
              NPM_RUN_BUILD=false \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              DATABASE_PATH=/home/data/stock.db

      - name: Clean old wwwroot and deploy via Kudu API
        run: |
          echo "Getting deployment credentials..."
          az webapp deployment list-publishing-credentials \
            --name stock-platform-roy \
            --resource-group rg-yuzora_roy_ai > /tmp/creds.json
          USER=$(cat /tmp/creds.json | jq -r '.publishingUserName')
          PASS=$(cat /tmp/creds.json | jq -r '.publishingPassword')
          
          SCM_URL="https://stock-platform-roy.scm.azurewebsites.net"
          
          echo "Cleaning old wwwroot..."
          curl -X POST \
            --max-time 30 \
            -u "$USER:$PASS" \
            -H "Content-Type: application/json" \
            -d '{"command":"sh -c \"rm -rf /home/site/wwwroot/* /home/site/wwwroot/.[!.]* 2>/dev/null; echo CLEAN_DONE\"","dir":"/home/site/wwwroot"}' \
            "$SCM_URL/api/command"
          
          echo "Uploading deploy.zip (timeout: 600s)..."
          curl -X POST \
            --max-time 600 \
            --connect-timeout 60 \
            -u "$USER:$PASS" \
            -H "Content-Type: application/zip" \
            --data-binary @./deploy.zip \
            "$SCM_URL/api/zipdeploy?clean=true"
          
          echo "Waiting for deployment to settle..."
          sleep 15
          
          echo "Removing Oryx artifacts and verifying deployment..."
          curl -X POST \
            --max-time 60 \
            -u "$USER:$PASS" \
            -H "Content-Type: application/json" \
            -d '{"command":"sh -c \"rm -f /home/site/wwwroot/node_modules /home/site/wwwroot/oryx-manifest.toml /home/site/wwwroot/node_modules.tar.gz; if [ -f /home/site/wwwroot/node_modules/.bin/next ]; then echo NEXT_OK_BIN; else echo NEXT_MISSING; fi\"","dir":"/home"}' \
            "$SCM_URL/api/command"
