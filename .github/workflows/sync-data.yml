name: Sync gift data (stock.gift + MOPS)

on:
  schedule:
    # 台灣時間 02:30 每日 (UTC 18:30)
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync stock.gift gifts
        run: npm run sync:stockgift --workspace=packages/database

      - name: Sync MOPS claim rules (official announcements)
        run: npm run sync:mops --workspace=packages/database
